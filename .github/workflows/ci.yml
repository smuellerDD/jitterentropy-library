name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash everywhere, Windows included, so the steps stay identical.
defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux / ${{ matrix.os }} / ${{ matrix.cc }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
        cc: [ gcc, clang ]
        shared: [ 'ON', 'OFF' ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }}

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -LE unreliable

      - name: Run tests
        run: |
          echo "RLIMIT_MEMLOCK soft=$(ulimit -Sl) hard=$(ulimit -Hl)"
          cpuinfo=./build/tests/raw-entropy/recording_userspace/jitterentropy-cpuinfo
          "$cpuinfo"
          "$cpuinfo" --json | python3 -c 'import json,sys; json.load(sys.stdin)'
          "$cpuinfo" --summary
          export LD_LIBRARY_PATH="$PWD/build:$LD_LIBRARY_PATH"
          for opt in "" "--all-caches" "--force-internal-timer"; do
            ./build/tests/raw-entropy/recording_userspace/jitterentropy-rng 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            ./build/tests/raw-entropy/recording_userspace/jitterentropy-rng 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  linux-32bit:
    name: Linux / gcc -m32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32 \
            -DCMAKE_SHARED_LINKER_FLAGS=-m32

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run tests
        run: |
          file build/tests/gcd/gcd | grep -q '32-bit' || { echo "not a 32-bit build"; exit 1; }
          ctest --test-dir build --output-on-failure -LE unreliable
          ./build/tests/raw-entropy/recording_userspace/jitterentropy-cpuinfo
          for opt in "--all-caches" "--force-internal-timer"; do
            ./build/tests/raw-entropy/recording_userspace/jitterentropy-rng 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            ./build/tests/raw-entropy/recording_userspace/jitterentropy-rng 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  linux-musl:
    name: Linux / musl-gcc / ${{ matrix.link }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        link: [ dynamic, static ]
        include:
          - link: dynamic
            flags: ''
            expect: ld-musl
          - link: static
            flags: '-static'
            expect: statically linked
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils

      # musl-gcc's specs drop the system include path, which carries the Linux
      # UAPI headers jitterentropy_uapi.h needs. -idirafter keeps musl first.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=musl-gcc \
            -DCMAKE_C_FLAGS="${{ matrix.flags }} -idirafter /usr/include -idirafter /usr/include/x86_64-linux-gnu" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run tests
        run: |
          bin=build/tests/gcd/gcd
          file "$bin"

          if strings "$bin" | grep -q GLIBC; then
            echo "::error::GLIBC symbol versions present, this is not musl"
            exit 1
          fi

          file "$bin" | grep -q "${{ matrix.expect }}" || {
            echo "::error::expected a ${{ matrix.link }} binary (${{ matrix.expect }})"
            exit 1
          }

          ctest --test-dir build --output-on-failure -LE unreliable
          ./build/tests/raw-entropy/recording_userspace/jitterentropy-cpuinfo
          for opt in "" "--all-caches" "--force-internal-timer"; do
            ./build/tests/raw-entropy/recording_userspace/jitterentropy-rng 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            ./build/tests/raw-entropy/recording_userspace/jitterentropy-rng 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  linux-distro:
    name: ${{ matrix.name }} / cmake + make
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 7.9 is the last RHEL 7 minor release; the other entries float.
          - name: RHEL 7
            image: registry.access.redhat.com/ubi7/ubi:7.9
            # No distro CMake meets the 3.20 floor here.
            cmake: kitware
          - name: RHEL 8
            image: registry.access.redhat.com/ubi8/ubi:latest
            cmake: distro
          - name: RHEL 9
            image: registry.access.redhat.com/ubi9/ubi:latest
            cmake: distro
          - name: RHEL 10
            image: registry.access.redhat.com/ubi10/ubi:latest
            cmake: distro
          - name: SLES 15 SP7
            image: registry.suse.com/bci/bci-base:15.7
            cmake: distro
          - name: SLES 16.1
            image: registry.suse.com/bci/bci-base:16.1
            cmake: distro
          # quay.io: Docker Hub rate-limits anonymous pulls per source IP.
          - name: Arch Linux
            image: quay.io/archlinux/archlinux:latest
            cmake: distro
    env:
      CMAKE_VERSION: 3.31.9
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a ${{ matrix.name }} container
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e CMAKE_SOURCE="${{ matrix.cmake }}" \
            -e CMAKE_VERSION="$CMAKE_VERSION" \
            "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              # No apostrophes anywhere in here: the whole script is a
              # single-quoted argument to bash -c, and one would end it.
              if command -v dnf > /dev/null; then
                install="dnf -y install"
              elif command -v zypper > /dev/null; then
                install="zypper --non-interactive install"
              elif command -v pacman > /dev/null; then
                install="pacman -Sy --noconfirm --needed"
              else
                install="yum -y install"
              fi
              $install gcc make

              if [ "$CMAKE_SOURCE" = distro ]; then
                $install cmake
              else
                # tar is not in the RHEL 7 base image and the tarball needs it.
                $install tar
                url=https://github.com/Kitware/CMake/releases/download
                # Retries only: RHEL 7 ships curl 7.29, which has neither
                # --http1.1 nor --retry-all-errors, and no HTTP/2 either.
                curl -fsSL --retry 5 --retry-delay 5 \
                  "$url/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz" \
                  -o /tmp/cmake.tar.gz
                mkdir -p /opt/cmake
                tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
                export PATH=/opt/cmake/bin:$PATH
              fi

              MAKE=make sh .github/scripts/vm-build-and-test.sh
            '

  linux-kmod:
    name: Linux / kernel module / ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
        config: [ default, test-interface, minimal ]
        include:
          - config: default
            flags: ''
          - config: test-interface
            flags: CONFIG_EXTERNAL_JITTERENTROPY_TESTINTERFACE=y
          - config: minimal
            flags: >-
              CONFIG_EXTERNAL_JITTERENTROPY_KCAPI=n
              CONFIG_EXTERNAL_JITTERENTROPY_CHARDEV=n
              CONFIG_EXTERNAL_JITTERENTROPY_HWRNG=n
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-generic

      - name: Build
        run: |
          # Not /lib/modules/$(uname -r)/build: the runner kernel has no
          # installable headers, and a module only needs a configured tree.
          KDIR=$(ls -d /usr/src/linux-headers-*-generic | sort -V | tail -n 1)
          echo "Building against $KDIR"
          make -C "$KDIR" M="$PWD/linux_kernel" ${{ matrix.flags }} \
            modules -j "$(nproc)"

      - name: Show the result
        run: |
          ls -l linux_kernel/jitter_rng.ko
          modinfo linux_kernel/jitter_rng.ko

  linux-dkms:
    name: Linux / DKMS / ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
        config: [ default, test-interface ]
        include:
          - config: default
            testinterface: 'false'
          - config: test-interface
            testinterface: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install DKMS and kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y dkms linux-headers-generic

      - name: Check dkms.conf against the library version
        run: |
          eval "$(awk '$2 ~ /^JENT_(MAJVERSION|MINVERSION|PATCHLEVEL)$/ \
                       { print $2 "=" $3 }' jitterentropy.h)"
          header="$JENT_MAJVERSION.$JENT_MINVERSION.$JENT_PATCHLEVEL"
          conf=$(. ./dkms.conf >/dev/null; echo "$PACKAGE_VERSION")
          echo "jitterentropy.h: $header, dkms.conf: $conf"
          if [ "$header" != "$conf" ]; then
            echo "::error file=dkms.conf::PACKAGE_VERSION=$conf does not" \
                 "match the version in jitterentropy.h ($header)"
            exit 1
          fi
          echo "VERSION=$header" >> "$GITHUB_ENV"

      - name: Register the source tree
        run: |
          KDIR=$(ls -d /usr/src/linux-headers-*-generic | sort -V | tail -n 1)
          KVER=${KDIR#/usr/src/linux-headers-}
          echo "Building for $KVER against $KDIR"
          if [ ! -e "/lib/modules/$KVER/build" ]; then
            sudo mkdir -p "/lib/modules/$KVER"
            sudo ln -sfn "$KDIR" "/lib/modules/$KVER/build"
          fi
          echo "KVER=$KVER" >> "$GITHUB_ENV"

          sudo mkdir -p "/usr/src/jitterentropy-$VERSION"
          sudo cp -a . "/usr/src/jitterentropy-$VERSION/"

          if [ "${{ matrix.testinterface }}" = "true" ]; then
            config=/usr/src/jitterentropy-$VERSION/linux_kernel/Kbuild.config
            sudo sed -i \
              's/^# *\(CONFIG_EXTERNAL_JITTERENTROPY_TESTINTERFACE=y\)/\1/' \
              "$config"
            grep -q '^CONFIG_EXTERNAL_JITTERENTROPY_TESTINTERFACE=y' "$config"
          fi

          sudo dkms add -m jitterentropy -v "$VERSION"

      - name: Build and install
        run: |
          sudo dkms build -m jitterentropy -v "$VERSION" -k "$KVER"
          sudo dkms install -m jitterentropy -v "$VERSION" -k "$KVER"
          dkms status

      - name: Show and check the installed module
        run: |
          mapfile -t kos < <(find /lib/modules/"$KVER" -name 'jitter_rng.ko*' \
                                  -not -path '*/build/*')
          echo "installed as: ${kos[*]:-nothing}"
          test "${#kos[@]}" = 1
          ko=${kos[0]}
          ls -l "$ko"
          modinfo "$ko"

          # testing_osr says whether the edited Kbuild.config reached the
          # build. Not piped into grep: under pipefail, grep -q exiting early
          # can SIGPIPE modinfo exactly when the parameter is there.
          parm=$(modinfo -F parm "$ko")
          if grep -q '^testing_osr' <<< "$parm"; then
            found=true
          else
            found=false
          fi
          echo "test interface built in: $found" \
               "(expected ${{ matrix.testinterface }})"
          [ "$found" = "${{ matrix.testinterface }}" ]

      - name: Remove
        run: |
          sudo dkms remove -m jitterentropy -v "$VERSION" --all
          dkms status
          left=$(find /lib/modules/"$KVER" -name 'jitter_rng.ko*' \
                      -not -path '*/build/*')
          echo "left behind: ${left:-nothing}"
          test -z "$left"
          test ! -d "/var/lib/dkms/jitterentropy/$VERSION/$KVER"

  linux-in-tree-list:
    name: Linux / in-tree / enumerate
    runs-on: ubuntu-latest
    outputs:
      kernels: ${{ steps.list.outputs.kernels }}
    steps:
      - name: Read releases.json
        id: list
        run: |
          kernels=$(curl -fsSL --http1.1 \
              --retry 5 --retry-delay 5 --retry-all-errors \
              https://www.kernel.org/releases.json |
            jq -c '[.releases[]
                    | select(.iseol == false and .source != null)
                    | {moniker, version, source}]')

          if [ "$(jq 'length' <<<"$kernels")" -eq 0 ]; then
            echo "::error::no usable releases in releases.json"
            exit 1
          fi

          jq -r '.[] | "\(.moniker)\t\(.version)"' <<<"$kernels"
          echo "kernels=$kernels" >> "$GITHUB_OUTPUT"

  linux-in-tree:
    name: Linux / in-tree / ${{ matrix.moniker }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: linux-in-tree-list
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.linux-in-tree-list.outputs.kernels) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: jitterentropy-library

      - name: Install the kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev

      - name: Fetch the kernel source
        env:
          VERSION: ${{ matrix.version }}
          SOURCE: ${{ matrix.source }}
        run: |
          echo "Building Linux $VERSION from $SOURCE"

          # --http1.1: cdn.kernel.org resets HTTP/2 streams mid-transfer often
          # enough to matter, which curl reports as exit 92, and one tarball
          # needs no multiplexing. --retry-all-errors extends the retries to
          # transport failures rather than only to transient response codes.
          curl -fsSL --http1.1 --retry 5 --retry-delay 5 --retry-all-errors \
            "$SOURCE" -o linux.tar

          tar -xf linux.tar
          echo "KDIR=$PWD/$(tar -tf linux.tar | head -1 | cut -d/ -f1)" \
            >> "$GITHUB_ENV"

      - name: Copy the Jitter RNG tree into the kernel source (README step 1)
        run: cp -a jitterentropy-library "$KDIR/crypto/jitterentropy-library"

      - name: Point crypto/Makefile at the copy (README step 2)
        working-directory: ${{ env.KDIR }}
        run: |
          from='obj-$(CONFIG_CRYPTO_JITTERENTROPY) += jitterentropy_rng.o'
          to='obj-$(CONFIG_CRYPTO_JITTERENTROPY) += jitterentropy-library/linux_kernel/'
          if ! grep -qxF "$from" crypto/Makefile; then
            echo "::error::crypto/Makefile has no line \"$from\" -" \
                 "the README's step 2 no longer describes this kernel"
            exit 1
          fi
          awk -v from="$from" -v to="$to" \
              '$0 == from { print to; next } { print }' \
              crypto/Makefile > crypto/Makefile.new
          mv crypto/Makefile.new crypto/Makefile
          grep -nxF "$to" crypto/Makefile

      - name: Configure a minimal kernel (README step 3)
        working-directory: ${{ env.KDIR }}
        run: |
          make ARCH=x86_64 tinyconfig
          ./scripts/config --enable CRYPTO \
                           --enable CRYPTO_JITTERENTROPY \
                           --enable HW_RANDOM \
                           --enable PROC_FS
          make ARCH=x86_64 olddefconfig

          for opt in CONFIG_64BIT CONFIG_CRYPTO_JITTERENTROPY \
                     CONFIG_HW_RANDOM CONFIG_PROC_FS; do
            grep -qx "$opt=y" .config || {
              echo "::error::$opt=y is not in the generated .config"
              exit 1
            }
          done
          if grep -qx 'CONFIG_MODULES=y' .config; then
            echo "::error::CONFIG_MODULES is set, this is not a builtin build"
            exit 1
          fi

      - name: Select the builtin configuration (README step 4)
        working-directory: ${{ env.KDIR }}/crypto/jitterentropy-library/linux_kernel
        run: |
          sed -i -e 's/^CONFIG_EXTERNAL_JITTERENTROPY=m$/CONFIG_EXTERNAL_JITTERENTROPY=y/' \
                 -e 's/^# *CONFIG_BUILTIN_JITTERENTROPY=y$/CONFIG_BUILTIN_JITTERENTROPY=y/' \
                 Kbuild.config
          for opt in CONFIG_EXTERNAL_JITTERENTROPY=y CONFIG_BUILTIN_JITTERENTROPY=y; do
            grep -qx "$opt" Kbuild.config || {
              echo "::error file=linux_kernel/Kbuild.config::$opt was not set -" \
                   "the README's step 4 no longer describes this file"
              exit 1
            }
          done

      - name: Build the kernel
        working-directory: ${{ env.KDIR }}
        run: make ARCH=x86_64 vmlinux -j "$(nproc)"

      - name: Check what ended up in vmlinux
        working-directory: ${{ env.KDIR }}
        run: |
          syms=$(nm vmlinux | grep ' [TtRrDdBb] jent_' || true)
          echo "$syms"

          grep -q ' jent_entropy_collector_alloc$' <<< "$syms" || {
            echo "::error::no jent_entropy_collector_alloc in vmlinux"
            exit 1
          }

          grep -q ' jent_status$' <<< "$syms" || {
            echo "::error::no jent_status in vmlinux - the kernel's own Jitter" \
                 "RNG copy was built instead of this tree"
            exit 1
          }

          test ! -e crypto/jitterentropy.o
          find crypto/jitterentropy-library -name '*.o' | sort

  nix-list:
    name: Nix / enumerate outputs
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.list.outputs.pairs }}
      intree: ${{ steps.intree.outputs.attrs }}
      cross: ${{ steps.cross.outputs.attrs }}
      consumers: ${{ steps.consumers.outputs.attrs }}
      crypto: ${{ steps.crypto.outputs.attrs }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: List the kernel module outputs and their VM tests
        id: list
        run: |
          modules=$(nix eval --json .#packages.x86_64-linux --apply \
            'ps: builtins.filter
                   (n: builtins.match "jitterentropy-module.*" n != null
                       && n != "jitterentropy-module-i686")
                   (builtins.attrNames ps)')
          vms=$(nix eval --json .#checks.x86_64-linux --apply \
            'cs: builtins.attrNames cs')

          pairs=$(jq -cn --argjson modules "$modules" --argjson vms "$vms" '
            $modules
            | map({ attr: ., vm: sub("^jitterentropy-module"; "vm") })
            | map(select([.vm] | inside($vms)))')

          missing=$(jq -rn --argjson modules "$modules" --argjson pairs "$pairs" \
            '($modules - ($pairs | map(.attr))) | join(" ")')
          if [ -n "$missing" ]; then
            echo "::error::no VM test in .#checks.x86_64-linux for: $missing"
            exit 1
          fi

          jq -r '.[] | "\(.attr) -> \(.vm)"' <<<"$pairs"
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"

      - name: List the in-tree kernel build outputs
        id: intree
        run: |
          intree=$(nix eval --json .#packages.x86_64-linux --apply \
            'ps: builtins.filter
                   (n: builtins.match "jitterentropy-in-tree.*" n != null)
                   (builtins.attrNames ps)')

          if [ "$(jq 'length' <<<"$intree")" -eq 0 ]; then
            echo "::error::no jitterentropy-in-tree-* outputs in" \
                 ".#packages.x86_64-linux"
            exit 1
          fi

          jq -r '.[]' <<<"$intree"
          echo "attrs=$intree" >> "$GITHUB_OUTPUT"

      - name: List the cross-compilation outputs
        id: cross
        run: |
          cross=$(nix eval --json .#packages.x86_64-linux --apply \
            'ps: builtins.filter
                   (n: builtins.match "cross-.*" n != null)
                   (builtins.attrNames ps)')

          if [ "$(jq 'length' <<<"$cross")" -eq 0 ]; then
            echo "::error::no cross-* outputs in .#packages.x86_64-linux"
            exit 1
          fi

          jq -r '.[]' <<<"$cross"
          echo "attrs=$cross" >> "$GITHUB_OUTPUT"

      - name: List the downstream consumer outputs
        id: consumers
        run: |
          consumers=$(nix eval --json .#packages.x86_64-linux --apply \
            'ps: builtins.filter
                   (n: builtins.match "consumer-.*" n != null)
                   (builtins.attrNames ps)')

          if [ "$(jq 'length' <<<"$consumers")" -eq 0 ]; then
            echo "::error::no consumer-* outputs in .#packages.x86_64-linux"
            exit 1
          fi

          jq -r '.[]' <<<"$consumers"
          echo "attrs=$consumers" >> "$GITHUB_OUTPUT"

      - name: List the external crypto backend outputs
        id: crypto
        run: |
          crypto=$(nix eval --json .#packages.x86_64-linux --apply \
            'ps: builtins.filter
                   (n: builtins.match "crypto-.*" n != null)
                   (builtins.attrNames ps)')

          if [ "$(jq 'length' <<<"$crypto")" -eq 0 ]; then
            echo "::error::no crypto-* outputs in .#packages.x86_64-linux"
            exit 1
          fi

          jq -r '.[]' <<<"$crypto"
          echo "attrs=$crypto" >> "$GITHUB_OUTPUT"

  nix-kmod:
    name: Nix / ${{ matrix.attr }}
    runs-on: ubuntu-latest
    needs: nix-list
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.nix-list.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Nix only advertises kvm if /dev/kvm existed at daemon start.
            system-features = nixos-test benchmark big-parallel kvm

      - name: Build
        run: nix build --no-link --print-build-logs ".#${{ matrix.attr }}"

      - name: Show the result
        run: |
          ko=$(find "$(nix path-info ".#${{ matrix.attr }}")" -name '*.ko')
          ls -l "$ko"
          nix shell nixpkgs#kmod -c modinfo "$ko"

      # /dev/kvm is root-only on the runners; without this QEMU uses TCG.
      - name: Enable KVM for the unprivileged builder
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the VM integration test
        run: |
          nix build --no-link --print-build-logs \
            ".#checks.x86_64-linux.${{ matrix.vm }}"

  nix-in-tree:
    name: Nix / ${{ matrix.attr }}
    runs-on: ubuntu-latest
    needs: nix-list
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.nix-list.outputs.intree) }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        id: build
        run: |
          out=$(nix build --no-link --print-build-logs --print-out-paths \
            ".#${{ matrix.attr }}")
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Show the result
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: |
          grep -E '^CONFIG_(CRYPTO_JITTERENTROPY|MODULES|HW_RANDOM|PROC_FS)' \
            "$OUT/config" || true
          ls -l "$OUT/vmlinux"
          wc -l < "$OUT/jent-symbols"
          grep -E ' (jent_status|jent_entropy_collector_alloc)$' \
            "$OUT/jent-symbols"

  nix-cross:
    name: Nix / ${{ matrix.attr }}
    runs-on: ubuntu-latest
    needs: nix-list
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.nix-list.outputs.cross) }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        id: build
        run: |
          out=$(nix build --no-link --print-build-logs --print-out-paths \
            ".#${{ matrix.attr }}")
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Show the result
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: |
          find "$OUT" -type f \( -path '*/bin/*' -o -name '*.a' -o -name '*.so*' \
            -o -name '*.dll' \) -print0 |
            xargs -0 --no-run-if-empty nix shell nixpkgs#file -c file

  nix-consumers:
    name: Nix / ${{ matrix.attr }}
    runs-on: ubuntu-latest
    needs: nix-list
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.nix-list.outputs.consumers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        id: build
        run: |
          out=$(nix build --no-link --print-build-logs --print-out-paths \
            ".#${{ matrix.attr }}")
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Show the result
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: |
          case "${{ matrix.attr }}" in
          consumer-rng-tools*) file=bin/rngd; nmflags="" ;;
          consumer-esdm*) file=lib/libesdm.so; nmflags="-D" ;;
          *)
            echo "::error::no result check defined for ${{ matrix.attr }}"
            exit 1
            ;;
          esac

          syms=$(nix shell nixpkgs#binutils -c \
            nm $nmflags --defined-only "$OUT/$file")
          grep -E ' [TtWw] jent_' <<<"$syms" | head -20
          grep -qE ' [TtWw] jent_entropy_init$' <<<"$syms" || {
            echo "::error::no jitterentropy symbols in $file"
            exit 1
          }

  nix-crypto:
    name: Nix / ${{ matrix.attr }}
    runs-on: ubuntu-latest
    needs: nix-list
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.nix-list.outputs.crypto) }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        id: build
        run: |
          out=$(nix build --no-link --print-build-logs --print-out-paths \
            ".#${{ matrix.attr }}")
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Show the result
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: |
          case "${{ matrix.attr }}" in
          crypto-openssl|crypto-awslc) needed=libcrypto ;;
          crypto-libgcrypt)            needed=libgcrypt ;;
          *)
            echo "::error::no result check defined for ${{ matrix.attr }}"
            exit 1
            ;;
          esac

          for bin in bin/jitterentropy-hashtime lib/libjitterentropy.so; do
            echo "==> $bin"
            nix shell nixpkgs#binutils -c readelf -d "$OUT/$bin" |
              grep NEEDED
          done

          nix shell nixpkgs#binutils -c readelf -d \
            "$OUT/bin/jitterentropy-hashtime" |
            grep -q "NEEDED.*$needed" || {
              echo "::error::$needed is not linked into jitterentropy-hashtime"
              exit 1
            }

      - name: Run tests
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: |
          "$OUT/bin/gcd"
          for opt in "" "--force-internal-timer" "--all-caches"; do
            "$OUT/bin/jitterentropy-rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            "$OUT/bin/jitterentropy-rng" 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed"
          done

  sanitizers:
    name: Linux / ${{ matrix.cc }} / sanitizers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure -LE unreliable

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          bin=./build/tests/raw-entropy/recording_userspace

          run_tolerated() {
            log="$RUNNER_TEMP/sanitizer-run.log"

            if "$@" > /dev/null 2> "$log"; then
              return 0
            fi

            cat "$log"
            if grep -qE 'Sanitizer|runtime error:' "$log"; then
              echo "::error::sanitizer report from: $*"
              exit 1
            fi
            echo "::warning::failed without a sanitizer finding: $*"
          }

          "$bin/jitterentropy-cpuinfo"
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$bin/jitterentropy-rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            run_tolerated "$bin/jitterentropy-rng" 256 $opt
          done

          run_tolerated "$bin/jitterentropy-hashtime" \
            1000 2 "$RUNNER_TEMP/hashtime" --force-fips

  coverage:
    name: Linux / gcc / coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr
          gcovr --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=gcc \
            -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -LE unreliable

      - name: Generate the HTML coverage report
        run: |
          echo "RLIMIT_MEMLOCK soft=$(ulimit -Sl) hard=$(ulimit -Hl)"
          cmake --build build --target coverage

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/
          if-no-files-found: error

  nix-musl:
    name: Nix / musl-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        id: build
        run: |
          out=$(nix build --no-link --print-build-logs --print-out-paths \
            .#musl-static)
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: |
          nix shell nixpkgs#file nixpkgs#binutils -c sh -c '
            set -e
            file "$1"

            if strings "$1" | grep -q GLIBC; then
              echo "::error::GLIBC symbol versions present, this is not musl"
              exit 1
            fi

            file "$1" | grep -q "statically linked" || {
              echo "::error::expected a statically linked binary"; exit 1
            }
          ' sh "$OUT/bin/gcd"

          "$OUT/bin/gcd"
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$OUT/bin/jitterentropy-rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            "$OUT/bin/jitterentropy-rng" 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  nix-android:
    name: Nix / android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        id: build
        run: |
          out=$(nix build --no-link --print-build-logs --print-out-paths .#android)
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Show the result
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: |
          find "$OUT/lib" -name '*.so' -print0 |
            xargs -0 --no-run-if-empty nix shell nixpkgs#file -c file
          for abi in arm64-v8a x86_64; do
            test -f "$OUT/lib/$abi/libjitterentropy.so" || {
              echo "::error::no libjitterentropy.so for ABI $abi"
              exit 1
            }
          done

  makefile:
    name: Makefile / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make -j 4

      - name: Build and run the CPU information tool
        working-directory: tests/raw-entropy/recording_userspace
        run: |
          make -f Makefile.cpuinfo
          ./jitterentropy-cpuinfo

      - name: Link and run against the built library
        run: |
          cat > smoke.c <<'EOF'
          #include <stdio.h>
          #include "jitterentropy.h"

          static int collect(unsigned int flags, const char *what)
          {
                  char buf[64];
                  struct rand_data *ec = jent_entropy_collector_alloc(0, flags);

                  if (!ec) { printf("alloc failed (%s)\n", what); return 1; }
                  if (jent_read_entropy(ec, buf, sizeof(buf)) != (ssize_t)sizeof(buf)) {
                          printf("short read (%s)\n", what);
                          jent_entropy_collector_free(ec);
                          return 1;
                  }
                  jent_entropy_collector_free(ec);
                  printf("ok (%s)\n", what);
                  return 0;
          }

          int main(void) {
                  int rc = jent_entropy_init();
                  if (rc) { printf("jent_entropy_init: %d\n", rc); return 1; }
                  if (collect(0, "default")) return 1;
                  /*
                   * Forced: where the counter read works the automatic
                   * selection never reaches the thread back-end, the one the
                   * Makefile's -pthread exists for.
                   */
                  if (collect(JENT_FORCE_INTERNAL_TIMER, "internal timer")) return 1;
                  return 0;
          }
          EOF
          case "${{ runner.os }}" in
            Linux) LIBS="-pthread -lrt" ;;
            *)     LIBS="-pthread" ;;
          esac
          cc -std=c11 -I. smoke.c libjitterentropy.a $LIBS -o smoke
          ./smoke

      - name: Link and run against the installed library
        run: |
          # Rebuilt rather than installed on top: on macOS PREFIX is baked in
          # at link time as -install_name.
          make clean
          make -j 4 PREFIX="$PWD/prefix"
          make install install-static PREFIX="$PWD/prefix"
          ls -l prefix/lib
          case "${{ runner.os }}" in
            Linux) LIBS="-pthread -lrt" ;;
            *)     LIBS="-pthread" ;;
          esac
          # The rpath frees the run from the loader variables macOS strips.
          cc -std=c11 -Iprefix/include \
            tests/linking/jitterentropy-linktest.c \
            -Lprefix/lib -ljitterentropy $LIBS \
            -Wl,-rpath,"$PWD/prefix/lib" -o linktest-shared
          ./linktest-shared
          # The archive is named directly: -l would pick the shared object.
          cc -std=c11 -Iprefix/include \
            tests/linking/jitterentropy-linktest.c \
            prefix/lib/libjitterentropy.a $LIBS -o linktest-static
          ./linktest-static

  linking:
    name: Linking / ${{ matrix.os }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]
        shared: [ 'ON', 'OFF' ]
    steps:
      - uses: actions/checkout@v4

      # CMAKE_INSTALL_LIBDIR is pinned so the later steps can name the install
      # tree, and the prefix is a native path for Windows cmake.
      #
      # CMAKE_BUILD_TYPE must name the configuration the install asks for:
      # install(EXPORT) writes IMPORTED_LOCATION per configuration, and the
      # "noconfig" file a build type-less single-config generator produces is
      # not what --config Release looks for.
      - name: Build and install the library
        run: |
          prefix="$PWD/prefix"
          case "${{ runner.os }}" in
          Windows) prefix=$(cygpath -m "$prefix") ;;
          esac
          echo "JENT_PREFIX=$prefix" >> "$GITHUB_ENV"
          cmake -S . -B build \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --config Release --parallel 4
          cmake --install build --config Release

      - name: Link and run through the CMake package
        run: |
          cmake -S tests/linking -B build-cmake -DCMAKE_PREFIX_PATH="$JENT_PREFIX"
          cmake --build build-cmake --config Release --parallel 4
          # Multi-config generators put the binary in a per-config directory.
          case "${{ runner.os }}" in
          Windows)
            # The DLL is installed to bin/ and resolved from PATH.
            export PATH="$PWD/prefix/bin:$PATH"
            ./build-cmake/Release/jitterentropy-linktest.exe
            ;;
          *)
            export LD_LIBRARY_PATH="$PWD/prefix/lib:$LD_LIBRARY_PATH"
            export DYLD_LIBRARY_PATH="$PWD/prefix/lib:$DYLD_LIBRARY_PATH"
            ./build-cmake/jitterentropy-linktest
            ;;
          esac

      - name: Check the linkage
        if: runner.os != 'Windows'
        run: |
          bin=./build-cmake/jitterentropy-linktest
          case "${{ runner.os }}" in
          macOS) deps=$(otool -L "$bin") ;;
          *)     deps=$(ldd "$bin") ;;
          esac
          echo "$deps"
          if [ "${{ matrix.shared }}" = ON ]; then
            if ! grep -q libjitterentropy <<<"$deps"; then
              echo "::error::shared build has no libjitterentropy dependency"
              exit 1
            fi
          elif grep -q libjitterentropy <<<"$deps"; then
            echo "::error::static build has a libjitterentropy dependency"
            exit 1
          else
            echo "no libjitterentropy dependency, as expected of a static link"
          fi

      - name: Link and run through pkg-config
        if: runner.os != 'Windows'
        run: |
          # The macOS images do not always carry pkg-config; the Linux ones do.
          command -v pkg-config > /dev/null || brew install pkg-config
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          pkg-config --exists jitterentropy || {
            echo "::error::no jitterentropy.pc under $PKG_CONFIG_PATH"
            exit 1
          }
          echo "modversion: $(pkg-config --modversion jitterentropy)"
          # Only --static prints Libs.private.
          if [ "${{ matrix.shared }}" = ON ]; then
            libs=$(pkg-config --libs jitterentropy)
          else
            libs=$(pkg-config --static --libs jitterentropy)
          fi
          cflags=$(pkg-config --cflags jitterentropy)
          echo "cflags: $cflags"
          echo "libs:   $libs"
          # The run needs the directory in the binary too, macOS stripping
          # DYLD_LIBRARY_PATH under SIP.
          cc -std=c11 $cflags tests/linking/jitterentropy-linktest.c $libs \
            -Wl,-rpath,"$PWD/prefix/lib" -o linktest-pc
          ./linktest-pc

  linking-mingw:
    name: Linking / MinGW-w64 / shared=${{ matrix.shared }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shared: [ 'ON', 'OFF' ]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      # Native Windows programs, so their paths go through cygpath.
      - name: Build and install the library
        run: |
          prefix=$(cygpath -m "$PWD/prefix")
          echo "JENT_PREFIX=$prefix" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel 4
          cmake --install build

      - name: Link and run through the CMake package
        run: |
          cmake -S tests/linking -B build-cmake -G Ninja \
            -DCMAKE_PREFIX_PATH="$JENT_PREFIX"
          cmake --build build-cmake --parallel 4
          PATH="$PWD/prefix/bin:$PATH" ./build-cmake/jitterentropy-linktest.exe

      - name: Link and run through pkg-config
        run: |
          export PKG_CONFIG_PATH="$JENT_PREFIX/lib/pkgconfig"
          pkg-config --exists jitterentropy || {
            echo "::error::no jitterentropy.pc under $PKG_CONFIG_PATH"
            exit 1
          }
          if [ "${{ matrix.shared }}" = ON ]; then
            libs=$(pkg-config --libs jitterentropy)
          else
            libs=$(pkg-config --static --libs jitterentropy)
          fi
          cflags=$(pkg-config --cflags jitterentropy)
          echo "cflags: $cflags"
          echo "libs:   $libs"
          gcc -std=c11 $cflags tests/linking/jitterentropy-linktest.c $libs \
            -o linktest-pc.exe
          PATH="$PWD/prefix/bin:$PATH" ./linktest-pc.exe

  macos:
    name: macOS / ${{ matrix.os }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-15-intel ]
        shared: [ 'ON', 'OFF' ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=${{ matrix.shared }}

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure -LE unreliable
          ./build/tests/raw-entropy/recording_userspace/jitterentropy-cpuinfo
          ./build/tests/raw-entropy/recording_userspace/jitterentropy-cpuinfo --json > /dev/null
          export DYLD_LIBRARY_PATH="$PWD/build:$DYLD_LIBRARY_PATH"
          for opt in "" "--all-caches" "--force-internal-timer"; do
            ./build/tests/raw-entropy/recording_userspace/jitterentropy-rng 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            ./build/tests/raw-entropy/recording_userspace/jitterentropy-rng 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  freebsd:
    name: FreeBSD / cmake + make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            pkg install -y cmake gmake
          run: |
            sh .github/scripts/vm-build-and-test.sh

  openbsd:
    name: OpenBSD / cmake + make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            pkg_add -I cmake gmake
          run: |
            sh .github/scripts/vm-build-and-test.sh

  netbsd:
    name: NetBSD / cmake + make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            /usr/sbin/pkg_add cmake gmake
          run: |
            sh .github/scripts/vm-build-and-test.sh

  dragonflybsd:
    name: DragonFly BSD / cmake + make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a DragonFly BSD VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            pkg install -y cmake gmake
          run: |
            sh .github/scripts/vm-build-and-test.sh

  solaris:
    name: Solaris / cmake + make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a Solaris VM
        uses: vmactions/solaris-vm@v1
        with:
          release: "11.4-gcc"
          usesh: true
          copyback: false
          prepare: |
            # pkg(1) exits 4 for "nothing to do".
            pkg install developer/build/cmake developer/build/gnu-make || [ $? -eq 4 ]
          run: |
            CC=gcc sh .github/scripts/vm-build-and-test.sh

  haiku:
    name: Haiku / cmake + make
    runs-on: ubuntu-latest
    # Disabled: the cached VM image and the rolling HaikuPorts repository
    # disagree, so pkgman fails to install cmake and the build never starts.
    # Re-enable by deleting this line, ideally with disable-cache set.
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a Haiku VM
        uses: vmactions/haiku-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            pkgman install -y cmake make
          run: |
            MAKE=make sh .github/scripts/vm-build-and-test.sh

  cygwin:
    name: Cygwin / cmake + make
    runs-on: windows-latest
    steps:
      # Before the checkout: Cygwin's sh trips over CRLF line endings.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4

      - uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            cmake
            gcc-core
            make
            binutils

      - name: Build and test
        run: MAKE=make sh .github/scripts/vm-build-and-test.sh

  windows-msvc:
    name: Windows / MSVC / ${{ matrix.os }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm ]
        shared: [ 'ON', 'OFF' ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=${{ matrix.shared }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run tests
        run: |
          export PATH="$PWD/build/Release:$PATH"
          ctest --test-dir build -C Release --output-on-failure -LE unreliable
          ./build/tests/raw-entropy/recording_userspace/Release/jitterentropy-cpuinfo.exe
          rng=./build/tests/raw-entropy/recording_userspace/Release/jitterentropy-rng.exe
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            "$rng" 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  windows-clang-cl:
    name: Windows / clang-cl
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -T ClangCL

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run tests
        run: |
          ctest --test-dir build -C Release --output-on-failure -LE unreliable
          ./build/tests/raw-entropy/recording_userspace/Release/jitterentropy-cpuinfo.exe
          rng=./build/tests/raw-entropy/recording_userspace/Release/jitterentropy-rng.exe
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            "$rng" 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  windows-mingw:
    name: Windows / MinGW-w64 / ${{ matrix.msystem }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
          - msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure -LE unreliable
          ./build/tests/raw-entropy/recording_userspace/jitterentropy-cpuinfo.exe
          rng=./build/tests/raw-entropy/recording_userspace/jitterentropy-rng.exe
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            "$rng" 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done
