name: Windows

# Windows: MSVC, clang-cl, MinGW and Cygwin.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash everywhere, Windows included, so the steps stay identical.
defaults:
  run:
    shell: bash

jobs:
  windows-msvc:
    name: MSVC, ${{ matrix.os }}, ${{ matrix.shared == 'ON' && 'shared' || 'static' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm ]
        shared: [ 'ON', 'OFF' ]
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=${{ matrix.shared }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run tests
        run: |
          export PATH="$PWD/build/Release:$PATH"
          ctest --test-dir build -C Release --output-on-failure -LE unreliable
          ./build/tests/raw-entropy/recording_userspace/Release/jitterentropy-cpuinfo.exe
          rng=./build/tests/raw-entropy/recording_userspace/Release/jitterentropy-rng.exe
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            "$rng" 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  # On arm64 as well: clang in MSVC mode takes neither MSVC's ARM intrinsics
  # nor its x86 ones, so its branches in arch/ differ from both.
  windows-clang-cl:
    name: clang-cl, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm ]
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -T ClangCL

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run tests
        run: |
          ctest --test-dir build -C Release --output-on-failure -LE unreliable
          ./build/tests/raw-entropy/recording_userspace/Release/jitterentropy-cpuinfo.exe
          rng=./build/tests/raw-entropy/recording_userspace/Release/jitterentropy-rng.exe
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            "$rng" 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  windows-mingw:
    name: MinGW-w64, ${{ matrix.msystem }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
          - msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure -LE unreliable
          ./build/tests/raw-entropy/recording_userspace/jitterentropy-cpuinfo.exe
          rng=./build/tests/raw-entropy/recording_userspace/jitterentropy-rng.exe
          for opt in "" "--all-caches" "--force-internal-timer"; do
            "$rng" 256 $opt > /dev/null
          done

          for opt in "--force-fips" "--ntg1"; do
            "$rng" 256 $opt > /dev/null ||
              echo "::warning::jitterentropy-rng $opt failed on this machine"
          done

  linking-mingw:
    name: linking, MinGW-w64, ${{ matrix.shared == 'ON' && 'shared' || 'static' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shared: [ 'ON', 'OFF' ]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      # Native Windows programs, so their paths go through cygpath.
      - name: Build and install the library
        run: |
          prefix=$(cygpath -m "$PWD/prefix")
          echo "JENT_PREFIX=$prefix" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel 4
          cmake --install build

      - name: Link and run through the CMake package
        run: |
          cmake -S tests/linking -B build-cmake -G Ninja \
            -DCMAKE_PREFIX_PATH="$JENT_PREFIX"
          cmake --build build-cmake --parallel 4
          PATH="$PWD/prefix/bin:$PATH" ./build-cmake/jitterentropy-linktest.exe

      - name: Link and run through pkg-config
        run: |
          export PKG_CONFIG_PATH="$JENT_PREFIX/lib/pkgconfig"
          pkg-config --exists jitterentropy || {
            echo "::error::no jitterentropy.pc under $PKG_CONFIG_PATH"
            exit 1
          }
          # The library itself is in Libs for both kinds of build, so a plain
          # --libs names it even where only the archive is installed. What a
          # plain --libs may lack for a static build is Libs.private, the
          # archive's own dependencies, which is why the link below still uses
          # --static; this is the check that --static alone would hide.
          if ! pkg-config --libs jitterentropy | grep -qw -- -ljitterentropy; then
            echo "::error::pkg-config --libs does not name -ljitterentropy"
            exit 1
          fi
          if [ "${{ matrix.shared }}" = ON ]; then
            libs=$(pkg-config --libs jitterentropy)
          else
            libs=$(pkg-config --static --libs jitterentropy)
          fi
          cflags=$(pkg-config --cflags jitterentropy)
          echo "cflags: $cflags"
          echo "libs:   $libs"
          gcc -std=c11 $cflags tests/linking/jitterentropy-linktest.c $libs \
            -o linktest-pc.exe
          PATH="$PWD/prefix/bin:$PATH" ./linktest-pc.exe

  cygwin:
    name: Cygwin
    runs-on: windows-latest
    steps:
      # Before the checkout: Cygwin's sh trips over CRLF line endings.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v5

      - uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            cmake
            gcc-core
            make
            binutils

      - name: Build and test
        run: MAKE="make" bash .github/scripts/vm-build-and-test.sh
