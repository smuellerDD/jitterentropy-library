# DKMS configuration for the Jitter RNG kernel module
#
# DKMS rebuilds jitter_rng.ko whenever a new kernel is installed, so the module
# survives kernel updates without a manual rebuild.
#
# The whole source tree is the DKMS source: linux_kernel/Kbuild.source pulls the
# entropy core out of ../src and the architecture backends out of ../arch, so
# this file lives in the project root rather than in linux_kernel/ - a DKMS tree
# containing only linux_kernel/ would have nothing to compile.
#
# Installation:
#
#	VERSION=$(awk '/define[ \t]+JENT_(MAJVERSION|MINVERSION|PATCHLEVEL)/ \
#		       { printf "%s%s", sep, $3; sep="." }' jitterentropy.h)
#	sudo cp -a . /usr/src/jitterentropy-$VERSION
#	sudo dkms install -m jitterentropy -v $VERSION
#
# The build is configured through linux_kernel/Kbuild.config, which is part of
# the tree copied to /usr/src. Edit the copy under
# /usr/src/jitterentropy-<version>/linux_kernel/Kbuild.config and rebuild -
# unlike flags passed on a one-off make command line, changes made there are
# also picked up by the automatic rebuilds DKMS performs on kernel updates.

PACKAGE_NAME="jitterentropy"

# Keep in sync with JENT_MAJVERSION / JENT_MINVERSION / JENT_PATCHLEVEL in
# jitterentropy.h; CI fails the build if the two drift apart.
PACKAGE_VERSION="3.7.1"

# Built by linux_kernel/Makefile, which turns the kernel build system loose on
# linux_kernel/Kbuild. Going through that Makefile rather than invoking
# "make -C ${kernel_source_dir} M=..." directly keeps the DKMS build and the
# manual out-of-tree build on the same path, and gives the clean target the
# ../src and ../arch object lists it needs.
#
# -j is spelled out because DKMS does not add one of its own; the job count is
# substituted when DKMS sources this file, i.e. on the machine doing the build.
MAKE[0]="make -j$(nproc) -C linux_kernel KDIR=${kernel_source_dir}"
CLEAN="make -C linux_kernel KDIR=${kernel_source_dir} clean"

BUILT_MODULE_NAME[0]="jitter_rng"
BUILT_MODULE_LOCATION[0]="linux_kernel"

# Most distributions override this with their own location (/updates/dkms on
# Debian and Ubuntu, /extra on Fedora and openSUSE), but DKMS requires the
# variable to be set.
DEST_MODULE_LOCATION[0]="/kernel/drivers/char"

# Rebuild for every kernel installed from here on.
AUTOINSTALL="yes"
